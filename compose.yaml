x-spring-env: &spring-env
  DB_HOST: ${DB_HOST:-host.docker.internal}
  DB_PORT: ${DB_PORT:-3306}
  DB_USERNAME: ${DB_USERNAME:-minimart}
  DB_PASSWORD: ${DB_PASSWORD:-minimart}
  REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
  REDIS_PORT: ${REDIS_PORT:-6379}

x-spring-app: &spring-app
  environment:
    <<: *spring-env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - minimart
  restart: unless-stopped

x-spring-build: &spring-build
  additional_contexts:
    infra: ../minimart-infra

networks:
  minimart:
    name: minimart

services:
  gateway:
    <<: *spring-app
    build:
      context: ../minimart-gateway
      <<: *spring-build
    container_name: minimart-gateway
    ports:
      - "8080:8080"

  member-service:
    <<: *spring-app
    build:
      context: ../minimart-member-service
      <<: *spring-build
    container_name: minimart-member
    ports:
      - "8081:8081"

  product-service:
    <<: *spring-app
    build:
      context: ../minimart-product-service
      <<: *spring-build
    container_name: minimart-product
    ports:
      - "8082:8082"

  order-service:
    <<: *spring-app
    build:
      context: ../minimart-order-service
      <<: *spring-build
    container_name: minimart-order
    ports:
      - "8083:8083"

  payment-service:
    <<: *spring-app
    build:
      context: ../minimart-payment-service
      <<: *spring-build
    container_name: minimart-payment
    ports:
      - "8084:8084"
