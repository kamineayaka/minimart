server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:host.docker.internal}:${DB_PORT:3306}/minimart_order?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USERNAME:minimart}
    password: ${DB_PASSWORD:minimart}
  cloud:
    openfeign:
      client:
        config:
          product-service:
            url: http://product-service:8082
          member-service:
            url: http://member-service:8081
          payment-service:
            url: http://payment-service:8084
