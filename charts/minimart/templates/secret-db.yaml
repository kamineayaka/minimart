apiVersion: v1
kind: Secret
metadata:
  name: minimart-db
  labels:
    {{- include "minimart.labels" (dict "ctx" . "name" "minimart-db") | nindent 4 }}
type: Opaque
stringData:
  # Placeholder. Override mysql.password at install time. Not a real credential.
  password: {{ required "mysql.password must be a non-empty placeholder or an install-time override" .Values.mysql.password | quote }}
