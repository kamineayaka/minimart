apiVersion: v1
kind: Secret
metadata:
  name: minimart-jwt
  labels:
    {{- include "minimart.labels" (dict "ctx" . "name" "minimart-jwt") | nindent 4 }}
type: Opaque
stringData:
  # Placeholder. JWT issuance is not implemented; no Deployment mounts this secret yet.
  secret: {{ required "jwt.secret must be a non-empty placeholder" .Values.jwt.secret | quote }}
