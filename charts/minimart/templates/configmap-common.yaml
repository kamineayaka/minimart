apiVersion: v1
kind: ConfigMap
metadata:
  name: minimart-common
  labels:
    {{- include "minimart.labels" (dict "ctx" . "name" "minimart-common") | nindent 4 }}
data:
  # Mirrors k8s/config/minimart-common.yaml (Jackson, Feign timeouts, health, log pattern).
  minimart-common.yaml: |
{{ .Files.Get "files/minimart-common.yaml" | indent 4 }}
